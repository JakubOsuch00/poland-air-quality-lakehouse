gios_api:
  base_url: https://api.gios.gov.pl/pjp-api/v1/rest
  page_size: 500
  request_timeout_s: 30

open_meteo:
  archive_url: https://archive-api.open-meteo.com/v1/archive
  hourly_variables:
    - temperature_2m
    - relative_humidity_2m
    - precipitation
    - surface_pressure
    - wind_speed_10m
    - wind_direction_10m
    - boundary_layer_height
  # only stations measuring these get weather data
  pollutants_of_interest: [PM10, PM2.5]
