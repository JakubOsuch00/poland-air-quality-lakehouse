name: aq-lakehouse

x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
  S3_BUCKET: ${S3_BUCKET:-lakehouse}

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    environment:
      <<: *s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/seaweedfs/s3.json <<EOF
        {"identities": [{"name": "lakehouse",
          "credentials": [{"accessKey": "$${S3_ACCESS_KEY}", "secretKey": "$${S3_SECRET_KEY}"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json \
          -master.volumeSizeLimitMB=1024 -volume.max=0
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master UI
    volumes:
      - seaweed-data:/data
    healthcheck:
      # localhost resolves to ::1 here
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  seaweed-data:
