name: aq-lakehouse

x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
  S3_BUCKET: ${S3_BUCKET:-lakehouse}

x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  image: aq-lakehouse/airflow:latest
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    <<: *s3-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/aq/dags
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-change-me-local-only}
    # local only - no login screen
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "spark://spark-master", "port": 7077}'
    SPARK_DRIVER_HOST: airflow-scheduler
  volumes:
    - ./src:/opt/aq/src
    - ./conf:/opt/aq/conf
    - ./dags:/opt/aq/dags
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    environment:
      <<: *s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/seaweedfs/s3.json <<EOF
        {"identities": [{"name": "lakehouse",
          "credentials": [{"accessKey": "$${S3_ACCESS_KEY}", "secretKey": "$${S3_SECRET_KEY}"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json \
          -master.volumeSizeLimitMB=1024 -volume.max=0
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master UI
    volumes:
      - seaweed-data:/data
    healthcheck:
      # localhost resolves to ::1 here
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: aq-lakehouse/spark:latest
    command: ["spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    environment:
      <<: *s3-env
    ports:
      - "8081:8080"   # master UI
      - "7077:7077"
    volumes:
      - ./src:/opt/aq/src
      - ./conf:/opt/aq/conf

  spark-worker:
    image: aq-lakehouse/spark:latest
    command:
      - spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "${SPARK_WORKER_CORES:-4}"
      - --memory
      - "${SPARK_WORKER_MEMORY:-4g}"
    environment:
      <<: *s3-env
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    volumes:
      - ./src:/opt/aq/src
      - ./conf:/opt/aq/conf

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    command: ["bash", "-c", "airflow db migrate && airflow pools set spark 1 'spark-submit jobs'"]
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/version"]
      interval: 15s
      retries: 10

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    # spark executors connect back to the driver running in this container
    hostname: airflow-scheduler

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor

volumes:
  seaweed-data:
  airflow-db:
  airflow-logs:
